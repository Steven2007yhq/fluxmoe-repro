[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxmoe-reference"
version = "0.1.0"
description = "Independent FluxMoE mechanism implementation and CPU event simulator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fluxmoe = "fluxmoe.cli:main"

[tool.setuptools.packages.find]
include = ["fluxmoe*"]
